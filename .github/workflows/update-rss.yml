name: Update Pinterest RSS feed
on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"
permissions:
  contents: write
concurrency:
  group: spinegear-rss
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build RSS feed
        run: python scripts/build_feed.py
      - name: Commit updated RSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml
          if ! git diff --cached --quiet; then
            git commit -m "Update Pinterest RSS feed"
            git push
          fi
